name: Recovery tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22', '24']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - name: Core and fault-injection tests
        shell: powershell
        run: |
          npm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run check
          exit $LASTEXITCODE
      - name: Windows process lifecycle tests
        shell: powershell
        run: .\test\launcher.integration.ps1
      - name: Verify release packaging
        shell: powershell
        run: .\scripts\Build-Release.ps1
